<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MUNO Splash Animation</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        min-height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        font-family: "Avenir Next", "SF Pro Display", "Helvetica Neue", sans-serif;
        background: #000;
        color: #fff;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
        -webkit-user-select: none;
        text-rendering: geometricPrecision;
      }

      .page {
        width: 100%;
        height: 100%;
        min-height: 100svh;
        display: grid;
        place-items: center;
        overflow: hidden;
        position: relative;
        isolation: isolate;
        padding:
          env(safe-area-inset-top)
          env(safe-area-inset-right)
          env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        box-sizing: border-box;
        background:
          radial-gradient(circle at center, rgba(255, 0, 0, 0.24) 0%, rgba(255, 0, 0, 0.08) 25%, rgba(255, 0, 0, 0) 58%),
          #000;
        opacity: 0;
        transform: translateZ(0);
        will-change: opacity;
      }

      .page.is-ready {
        opacity: 1;
        transition: opacity 0.16s ease-out;
      }

      .page::before {
        content: "";
        position: absolute;
        width: min(340px, 48vw);
        aspect-ratio: 1;
        border-radius: 50%;
        background:
          radial-gradient(circle, rgba(255, 37, 37, 0.2), rgba(255, 0, 0, 0.06) 44%, transparent 70%);
        filter: blur(18px);
        opacity: 0.7;
        pointer-events: none;
        z-index: 0;
      }

      .poster {
        width: min(190px, 44vw, 30vh);
        aspect-ratio: 1 / 1;
        display: grid;
        place-items: center;
        position: relative;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        overflow: visible;
        z-index: 1;
      }

      .logo-shell {
        width: 100%;
        max-width: 145px;
        perspective: 1000px;
        overflow: visible;
        position: relative;
        z-index: 2;
        will-change: transform;
      }

      .logo-shell .logo {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
        transform-style: preserve-3d;
        transform: rotate3d(0, 1, 0.42, 0deg);
        backface-visibility: visible;
        filter:
          drop-shadow(0 8px 22px rgba(255, 0, 0, 0.12))
          drop-shadow(0 16px 42px rgba(0, 0, 0, 0.28));
        will-change: transform;
      }

      .logo-depth {
        pointer-events: none;
        transform-box: fill-box;
        transform-origin: center;
        mix-blend-mode: normal;
        opacity: 0.34;
        filter:
          brightness(0)
          saturate(100%)
          sepia(96%)
          saturate(4200%)
          hue-rotate(335deg)
          brightness(0.42);
      }

      .depth-1 {
        transform: translate(4px, 4px);
        opacity: 0.28;
      }

      .depth-2 {
        transform: translate(7px, 8px);
        opacity: 0.2;
      }

      .depth-3 {
        transform: translate(11px, 12px);
        opacity: 0.13;
      }

      .depth-4 {
        transform: translate(14px, 16px);
        opacity: 0.08;
      }

      .logo-path {
        transform-origin: center;
        transform-box: fill-box;
        backface-visibility: visible;
        shape-rendering: geometricPrecision;
        will-change: transform, filter, opacity;
      }

      .brand-lockup {
        position: absolute;
        inset: -18% -24%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 9px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(26px) scale(0.42);
        filter: blur(22px);
        z-index: 1;
        will-change: transform, opacity, filter;
      }

      .brand-lockup.is-visible {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0px);
      }

      .brand-name {
        margin: 0;
        font-family: "Bodoni 72", "Didot", "Times New Roman", serif;
        font-size: clamp(2.35rem, 10vw, 3.9rem);
        font-weight: 900;
        line-height: 0.78;
        letter-spacing: 0.08em;
        text-indent: 0.08em;
        color: #fff;
        text-shadow:
          0 0 9px rgba(255, 255, 255, 0.14),
          0 12px 40px rgba(255, 20, 20, 0.16);
      }

      .brand-subtitle {
        margin: 0;
        font-family: "Avenir Next", "SF Pro Text", "Helvetica Neue", sans-serif;
        font-size: clamp(0.62rem, 2.2vw, 0.76rem);
        font-weight: 500;
        line-height: 1.25;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.76);
        text-align: center;
        text-wrap: balance;
      }

      .brand-subtitle::before {
        content: "";
        display: block;
        width: min(88px, 24vw);
        height: 1px;
        margin: 0 auto 10px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.72), rgba(255, 36, 36, 0.72), transparent);
      }
    </style>
  </head>

    <script>
      const logo = document.getElementById("logo");
      const page = document.querySelector(".page");
      const white = document.getElementById("white-mark");
      const swoosh = document.getElementById("red-swoosh");
      const dot = document.getElementById("red-dot-1");
      const brandLockup = document.getElementById("brand-lockup");
      let brandAnimation = null;
      let isAnimating = false;
      const resetTransform = "scaleX(1) scaleY(1) rotate(0deg) translate(0px, 0px)";
      const spinCount = 4;
      const spinDuration = 700 * spinCount;
      const morphStartDelay = spinDuration + 80;
      const morphDuration = 1180;
      const exitStartDelay = morphStartDelay + morphDuration + 520;
      const morphPointCount = 132;
      const svgNamespace = "http://www.w3.org/2000/svg";
      const activeTimeouts = new Set();
      const activeFrames = new Set();
      let didNotifyFinished = false;

      function arrowLinePath(x1, y1, x2, y2, radius) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const length = Math.hypot(dx, dy);
        const ux = dx / length;
        const uy = dy / length;
        const nx = -uy * radius;
        const ny = ux * radius;
        const tailX = x1 - ux * radius * 0.18;
        const tailY = y1 - uy * radius * 0.18;

        return [
          `M ${tailX + nx} ${tailY + ny}`,
          `C ${x1 + nx * 0.72} ${y1 + ny * 0.72} ${x2 - ux * radius * 0.28 + nx * 0.18} ${y2 - uy * radius * 0.28 + ny * 0.18} ${x2} ${y2}`,
          `C ${x2 - ux * radius * 0.28 - nx * 0.18} ${y2 - uy * radius * 0.28 - ny * 0.18} ${x1 - nx * 0.72} ${y1 - ny * 0.72} ${tailX - nx} ${tailY - ny}`,
          `A ${radius} ${radius} 0 0 1 ${tailX + nx} ${tailY + ny}`,
          "Z",
        ].join(" ");
      }

      const parts = [
        { kind: "white", element: white, originalD: white.getAttribute("d"), targetLine: { x1: 649, y1: 922, x2: 894, y2: 677, radius: 31 }, exit: "translate(1300px, -1300px)" },
        { kind: "swoosh", element: swoosh, originalD: swoosh.getAttribute("d"), targetLine: { x1: 740, y1: 975, x2: 986, y2: 729, radius: 31 }, exit: "translate(1390px, -1345px)" },
        { kind: "dot", element: dot, originalD: dot.getAttribute("d"), targetLine: { x1: 832, y1: 1029, x2: 1078, y2: 783, radius: 31 }, exit: "translate(1480px, -1390px)" },
      ].map((part) => ({
        ...part,
        targetD: arrowLinePath(part.targetLine.x1, part.targetLine.y1, part.targetLine.x2, part.targetLine.y2, part.targetLine.radius),
      }));

      function splitSubpaths(pathData) {
        return pathData.match(/M[^M]+/g) || [pathData];
      }

      function sampleSinglePathData(pathData, pointCount) {
        const sampler = document.createElementNS(svgNamespace, "path");
        sampler.setAttribute("d", pathData);
        sampler.setAttribute("fill", "none");
        sampler.setAttribute("stroke", "none");
        logo.appendChild(sampler);

        const length = sampler.getTotalLength();
        const points = Array.from({ length: pointCount }, (_, index) => {
          const point = sampler.getPointAtLength((length * index) / pointCount);
          return { x: point.x, y: point.y };
        });

        sampler.remove();
        return points;
      }

      function samplePathContours(pathData, pointCount) {
        return splitSubpaths(pathData).map((subpath) => sampleSinglePathData(subpath, pointCount));
      }

      function pathFromContour(points) {
        const [first, ...rest] = points;
        return `M ${first.x.toFixed(2)} ${first.y.toFixed(2)} ${rest
          .map((point) => `L ${point.x.toFixed(2)} ${point.y.toFixed(2)}`)
          .join(" ")} Z`;
      }

      function pathFromContours(contours) {
        return contours.map(pathFromContour).join(" ");
      }

      function smoothStep(value) {
        return value * value * (3 - 2 * value);
      }

      function clamp(value, min = 0, max = 1) {
        return Math.min(Math.max(value, min), max);
      }

      function guideOffset(kind, progress) {
        const routes = {
          white: [
            { at: 0, x: 0, y: 0 },
            { at: 0.16, x: -78, y: -88 },
            { at: 0.34, x: -138, y: -116 },
            { at: 0.52, x: -150, y: -2 },
            { at: 0.68, x: -94, y: 92 },
            { at: 0.84, x: -24, y: -46 },
            { at: 1, x: 0, y: 0 },
          ],
          swoosh: [
            { at: 0, x: 0, y: 0 },
            { at: 0.18, x: 34, y: -72 },
            { at: 0.42, x: 74, y: -24 },
            { at: 0.62, x: 22, y: 54 },
            { at: 0.82, x: -12, y: -20 },
            { at: 1, x: 0, y: 0 },
          ],
          dot: [
            { at: 0, x: 0, y: 0 },
            { at: 0.18, x: 30, y: -64 },
            { at: 0.42, x: 66, y: -10 },
            { at: 0.64, x: 6, y: 74 },
            { at: 0.84, x: -20, y: -28 },
            { at: 1, x: 0, y: 0 },
          ],
        };
        const route = routes[kind] || routes.white;
        const routeProgress = clamp(progress);
        const index = route.findIndex((point) => routeProgress <= point.at);
        const end = route[Math.max(1, index)];
        const start = route[Math.max(0, index - 1)];
        const localProgress = smoothStep((routeProgress - start.at) / (end.at - start.at));

        return {
          x: start.x + (end.x - start.x) * localProgress,
          y: start.y + (end.y - start.y) * localProgress,
        };
      }

      function sourceIndexForContour(points) {
        return points.reduce((bestIndex, point, index) => (
          point.y < points[bestIndex].y ? index : bestIndex
        ), 0);
      }

      function circularDistance(index, sourceIndex, pointCount) {
        const rawDistance = Math.abs(index - sourceIndex);
        return Math.min(rawDistance, pointCount - rawDistance) / Math.max(pointCount, 1);
      }

      function alignTargetToSource(targetPoints, sourceIndex) {
        return targetPoints.map((_, index) => {
          const targetIndex = (index - sourceIndex + targetPoints.length) % targetPoints.length;
          return targetPoints[targetIndex];
        });
      }

      function liquidPointProgress(kind, contourIndex, pointIndex, pointCount, sourceIndex, rawProgress) {
        const settings = {
          white: { delay: 0.48 },
          swoosh: { delay: 0.36 },
          dot: { delay: 0.3 },
        }[kind] || { delay: 0.34 };
        const leadingEdge = circularDistance(pointIndex, sourceIndex, pointCount);
        const contourLag = contourIndex * 0.035;
        const delayed = clamp((rawProgress - leadingEdge * settings.delay - contourLag) / (1 - settings.delay * 0.55));

        return clamp(easeLiquid(rawProgress) * 0.22 + smoothStep(delayed) * 0.78);
      }

      function liquidRipple(kind, contourIndex, pointIndex, pointCount, rawProgress) {
        const phase = pointIndex / pointCount;
        const envelope = Math.sin(rawProgress * Math.PI) * (1 - rawProgress * 0.28);
        const contourFade = contourIndex === 0 ? 1 : 0.55;
        const settings = {
          white: { x: 16, y: 12, speed: 5.2, phase: 0.2 },
          swoosh: { x: 12, y: 16, speed: 4.6, phase: 1.7 },
          dot: { x: 9, y: 11, speed: 5.8, phase: 3.1 },
        }[kind] || { x: 12, y: 12, speed: 5, phase: 0 };
        const travel = phase * Math.PI * 2 + rawProgress * settings.speed + settings.phase;

        return {
          x: Math.sin(travel) * settings.x * envelope * contourFade,
          y: Math.cos(travel * 0.85) * settings.y * envelope * contourFade,
        };
      }

      function interpolatePoints(from, to, rawProgress, kind, contourIndex, sourceIndex) {
        return from.map((point, index) => {
          const sourceDistance = circularDistance(index, sourceIndex, from.length);
          const trailAmount = {
            white: 0.5,
            swoosh: 0.36,
            dot: 0.28,
          }[kind] || 0.16;
          const guide = guideOffset(kind, rawProgress - sourceDistance * trailAmount - contourIndex * 0.035);
          const guideStrength = clamp(1 - sourceDistance * 2.7, 0.12, 1);
          const pointProgress = liquidPointProgress(kind, contourIndex, index, from.length, sourceIndex, rawProgress);
          const ripple = liquidRipple(kind, contourIndex, index, from.length, rawProgress);

          return {
            x: point.x + (to[index].x - point.x) * pointProgress + guide.x * guideStrength + ripple.x,
            y: point.y + (to[index].y - point.y) * pointProgress + guide.y * guideStrength + ripple.y,
          };
        });
      }

      function interpolateContours(fromContours, toContours, sourceIndices, rawProgress, kind) {
        return fromContours.map((points, index) => interpolatePoints(
          points,
          toContours[index],
          rawProgress,
          kind,
          index,
          sourceIndices[index],
        ));
      }

      function easeLiquid(value) {
        return 1 - Math.pow(1 - value, 3);
      }

      const morphs = parts.map((part) => {
        const fromContours = samplePathContours(part.originalD, morphPointCount);
        const targetContour = sampleSinglePathData(part.targetD, morphPointCount);
        const sourceIndices = fromContours.map(sourceIndexForContour);

        return {
          ...part,
          fromContours,
          sourceIndices,
          toContours: fromContours.map((_, index) => {
            if (index === 0) return alignTargetToSource(targetContour, sourceIndices[index]);

            const insetTargetD = arrowLinePath(
              part.targetLine.x1 + 18,
              part.targetLine.y1 - 18,
              part.targetLine.x2 - 18,
              part.targetLine.y2 + 18,
              Math.max(8, part.targetLine.radius * 0.62),
            );

            return alignTargetToSource(sampleSinglePathData(insetTargetD, morphPointCount), sourceIndices[index]);
          }),
        };
      });

      function scheduleTimeout(callback, delay) {
        const id = window.setTimeout(() => {
          activeTimeouts.delete(id);
          callback();
        }, delay);
        activeTimeouts.add(id);
      }

      function scheduleFrame(callback) {
        const id = window.requestAnimationFrame((time) => {
          activeFrames.delete(id);
          callback(time);
        });
        activeFrames.add(id);
      }

      function clearScriptedAnimations() {
        activeTimeouts.forEach((id) => window.clearTimeout(id));
        activeFrames.forEach((id) => window.cancelAnimationFrame(id));
        activeTimeouts.clear();
        activeFrames.clear();
      }

      function notifySplashFinished() {
        if (didNotifyFinished) return;
        didNotifyFinished = true;

        window.dispatchEvent(new CustomEvent("munoSplashFinished"));
        if (window.webkit?.messageHandlers?.splashFinished) {
          window.webkit.messageHandlers.splashFinished.postMessage("finished");
        }
      }

      function morphPath({ kind, element, fromContours, toContours, sourceIndices, targetD }, delay, duration) {
        scheduleTimeout(() => {
          const start = performance.now();
          const liquidHoldDuration = 420;

          function tick(now) {
            const rawProgress = Math.min((now - start) / duration, 1);
            const wave = Math.sin(rawProgress * Math.PI);

            if (rawProgress > 0.04) {
              element.setAttribute("fill-rule", "nonzero");
              element.setAttribute("clip-rule", "nonzero");
            }

            element.setAttribute("d", pathFromContours(interpolateContours(fromContours, toContours, sourceIndices, rawProgress, kind)));
            element.style.filter = `blur(${(1.45 * wave).toFixed(2)}px)`;
            element.style.transform = `scaleX(${(1 + 0.018 * wave).toFixed(3)}) scaleY(${(1 - 0.01 * wave).toFixed(3)}) rotate(0deg) translate(0px, 0px)`;

            if (rawProgress < 1) {
              scheduleFrame(tick);
            } else {
              element.setAttribute("fill-rule", "nonzero");
              element.setAttribute("clip-rule", "nonzero");
              const holdStartedAt = performance.now();

              function hold(holdNow) {
                const holdProgress = Math.min((holdNow - holdStartedAt) / liquidHoldDuration, 1);
                const holdWave = Math.sin(holdProgress * Math.PI * 2);
                const fade = 1 - holdProgress;
                const liquidContours = toContours.map((points, contourIndex) => points.map((point, pointIndex) => {
                  const ripple = liquidRipple(kind, contourIndex, pointIndex, points.length, holdProgress + 0.62);

                  return {
                    x: point.x + ripple.x * fade * 0.42 + holdWave * fade * 2.4,
                    y: point.y + ripple.y * fade * 0.42 - holdWave * fade * 1.6,
                  };
                }));

                element.setAttribute("d", pathFromContours(liquidContours));
                element.style.filter = `blur(${(0.25 * fade).toFixed(2)}px)`;
                element.style.transform = resetTransform;

                if (holdProgress < 1) {
                  scheduleFrame(hold);
                } else {
                  element.setAttribute("d", targetD);
                  element.style.filter = "blur(0px)";
                  element.style.transform = resetTransform;
                }
              }

              scheduleFrame(hold);
            }
          }

          scheduleFrame(tick);
        }, delay);
      }

      function reset() {
        clearScriptedAnimations();
        didNotifyFinished = false;
        logo.getAnimations().forEach((animation) => animation.cancel());
        white.getAnimations().forEach((animation) => animation.cancel());
        swoosh.getAnimations().forEach((animation) => animation.cancel());
        dot.getAnimations().forEach((animation) => animation.cancel());

        logo.style.transform = "rotate3d(0, 1, 0.42, 0deg)";
        if (brandAnimation) {
          brandAnimation.cancel();
          brandAnimation = null;
        }
        brandLockup.classList.remove("is-visible");
        morphs.forEach(({ element, originalD }) => {
          element.setAttribute("d", originalD);
          if (element === white) {
            element.setAttribute("fill-rule", "evenodd");
            element.setAttribute("clip-rule", "evenodd");
          } else {
            element.removeAttribute("fill-rule");
            element.removeAttribute("clip-rule");
          }
          element.style.opacity = "1";
          element.style.filter = "blur(0px)";
          element.style.transform = resetTransform;
        });
      }

      function playAnimation() {
        if (isAnimating) return;
        isAnimating = true;
        reset();
        page.classList.add("is-ready");

        logo.animate(
          [
            { transform: "rotate3d(0, 1, 0.42, 0deg)" },
            { transform: `rotate3d(0, 1, 0.42, ${360 * spinCount}deg)` },
          ],
          { duration: spinDuration, easing: "ease-in-out", fill: "forwards" },
        );

        morphs.forEach((morph, index) => {
          morphPath(morph, morphStartDelay + index * 85, morphDuration);
        });

        scheduleTimeout(() => {
          brandLockup.classList.add("is-visible");
          brandAnimation = brandLockup.animate(
            [
              { opacity: 0, transform: "translateY(30px) scale(0.42)", filter: "blur(24px)" },
              { opacity: 1, transform: "translateY(0px) scale(1)", filter: "blur(0px)" },
            ],
            {
              duration: 1350,
              easing: "cubic-bezier(0.16, 1, 0.3, 1)",
              fill: "forwards",
            },
          );
        }, 4650);

        const arrowFlights = morphs.map(({ element, exit }, index) => {
          return element.animate(
            [
              { transform: "translate(0px, 0px) rotate(0deg) scale(1)", opacity: 1, filter: "blur(0px)" },
              { transform: "translate(180px, -170px) rotate(2deg) scale(1.03)", opacity: 1, filter: "blur(0px)", offset: 0.22 },
              { transform: "translate(640px, -620px) rotate(9deg) scale(1.15)", opacity: 0.95, filter: "blur(0.25px)", offset: 0.62 },
              { transform: `${exit} rotate(14deg) scale(1.34)`, opacity: 0, filter: "blur(2.5px)" },
            ],
            {
              delay: exitStartDelay + index * 70,
              duration: 1250,
              easing: "cubic-bezier(0.22, 0.78, 0.16, 1)",
              fill: "forwards",
            },
          );
        });

        Promise.all(arrowFlights.map((animation) => animation.finished)).finally(() => {
          window.setTimeout(() => {
            isAnimating = false;
            notifySplashFinished();
          }, 200);
        });
      }

      document.getElementById("replay").addEventListener("click", playAnimation);

      requestAnimationFrame(() => {
        requestAnimationFrame(playAnimation);
      });
    </script>
  </body>
</html>
